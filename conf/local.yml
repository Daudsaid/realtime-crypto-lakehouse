# Local Docker profile: Delta tables addressed by PATH under the mounted ./data volume.
platform: local
use_tables: false
catalog: null

# Absolute, or relative to the repo root (parent of the conf dir); env CONTRACT_PATH overrides.
contract_path: /app/contracts/crypto_trades.yaml

storage:
  lakehouse_root: /app/data/lakehouse
  checkpoint_root: /app/checkpoints

kafka:
  bootstrap_servers: kafka:29092
  topic: crypto.trades.raw
  starting_offsets: earliest
  max_offsets_per_trigger: 50000

trigger:
  processing_time: 10 seconds
  available_now: false

postgres:
  jdbc_url: jdbc:postgresql://postgres:5432/crypto
  user: crypto
  schema: gold
