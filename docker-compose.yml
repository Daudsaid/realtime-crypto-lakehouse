x-spark: &spark
  image: crypto-stream-pipeline-spark
  build:
    context: .
    dockerfile: spark/Dockerfile
  init: true
  environment:
    PIPELINE_ENV: local
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_TOPIC: crypto.trades.raw
    POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/crypto
    POSTGRES_USER: ${POSTGRES_USER:-crypto}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
  volumes:
    - ./src:/app/src
    - ./conf:/app/conf
    - ./contracts:/app/contracts
    - ./tests:/app/tests
    - ./data:/app/data
    - ./checkpoints:/app/checkpoints
    - ivy-cache:/root/.ivy2

services:
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
      --create --if-not-exists --topic crypto.trades.raw
      --partitions 3 --replication-factor 1"

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
      POSTGRES_DB: ${POSTGRES_DB:-crypto}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto} -d ${POSTGRES_DB:-crypto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${POSTGRES_USER:-crypto}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-crypto}
    depends_on:
      postgres:
        condition: service_healthy

  producer:
    build: ./producer
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: crypto.trades.raw
      SYMBOLS: btcusdt,ethusdt
      BINANCE_WS_BASE: wss://data-stream.binance.vision
      LOG_LEVEL: INFO

  # Interactive container for ad-hoc jobs, tests and lint (`docker compose exec spark ...`).
  spark:
    <<: *spark
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "4040:4040"

  # The live lakehouse: bronze, silver, gold and serve in one SparkSession.
  # Do not run the individual jobs from the spark container while this is up (shared checkpoints).
  pipeline:
    <<: *spark
    command: ["python", "-m", "crypto_pipeline.run_all"]
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  ivy-cache:
