[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-pipeline"
version = "0.1.0"
description = "Real-time crypto market-data lakehouse: Kafka -> Spark -> Delta (bronze/silver/gold) -> Postgres/Metabase, deployable to Databricks."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Daud Said" }]
dependencies = [
    "pyspark>=3.5,<3.6",
    "delta-spark>=3.2,<3.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
dbt = [
    "dbt-databricks>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
